<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>預約服務</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 20px;
        background: #f8f9fa;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        max-width: 400px;
        margin: auto;
      }
      h2 {
        text-align: center;
        color: #111;
        margin-bottom: 25px;
      }
      label {
        font-weight: 600;
        display: block;
        margin-top: 15px;
        font-size: 14px;
        color: #555;
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 16px;
        -webkit-appearance: none;
      }
      select {
        background-image: url('data:image/svg+xml;charset=US-ASCII,<svg%20xmlns="http://www.w3.org/2000/svg"%20width="24"%20height="24"%20viewBox="0%200%2024%2024"><path%20fill="%23ccc"%20d="M7%2010l5%205%205-5z"/></svg>');
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 20px;
      }
      button {
        width: 100%;
        padding: 15px;
        background: #00b900;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        margin-top: 30px;
        cursor: pointer;
        font-weight: bold;
      }
      button:disabled {
        background: #e0e0e0;
        cursor: not-allowed;
      }
      .available-list {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
        background: #f0fdf4;
        padding: 8px;
        border-radius: 5px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>預約服務</h2>
      <form id="bookingForm">
        <label>姓名</label>
        <input type="text" id="name" placeholder="請輸入姓名" required />

        <label>電話</label>
        <input type="tel" id="phone" placeholder="請輸入電話" required />

        <label>預約日期</label>
        <input type="date" id="dateInput" onchange="filterTimes()" required />
        <div id="availableDates" class="available-list"></div>

        <label>預約時段</label>
        <select id="timeSelect" required disabled>
          <option value="">請先選擇日期</option>
        </select>

        <button type="submit" id="submitBtn">確認預約</button>
      </form>
    </div>

    <script>
      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbxPb07OiiKPl7Yt6JxYSoHsJBzn2PnzEIb7dKpF-A8ho6qQesg52ubo8GREv18BebKlfg/exec";
      const LIFF_ID = "2009975280-TRg5Qmp3";
      let allSlots = [];

      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          const res = await fetch(`${GAS_URL}?action=getAvailable`);
          allSlots = (await res.json()).map((slot) => ({
            date: normalizeDate(slot.date),
            time: normalizeTime(slot.time),
          }));

          document
            .getElementById("dateInput")
            .setAttribute("min", formatLocalDate(new Date()));

          showHint();
        } catch (e) {
          console.error("初始化失敗", e);
          allSlots = [];
        }
      }

      function showHint() {
        const uniqueDates = [...new Set(allSlots.map((s) => s.date))]
          .filter(Boolean)
          .sort();

        if (uniqueDates.length > 0) {
          const listDiv = document.getElementById("availableDates");
          listDiv.style.display = "block";
          listDiv.innerHTML = "可預約日期：<br>" + uniqueDates.join(", ");
        }
      }

      function filterTimes() {
        const selectedDate = document.getElementById("dateInput").value;
        const timeSelect = document.getElementById("timeSelect");
        const availableTimes = allSlots
          .filter((s) => s.date === selectedDate)
          .map((s) => s.time)
          .filter(Boolean)
          .sort();

        if (availableTimes.length > 0) {
          timeSelect.disabled = false;
          timeSelect.innerHTML = availableTimes
            .map((time) => `<option value="${time}">${time}</option>`)
            .join("");
          return;
        }

        timeSelect.disabled = true;
        timeSelect.innerHTML = '<option value="">請先選擇日期</option>';
      }

      function normalizeDate(value) {
        if (!value) {
          return "";
        }

        if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
          return value;
        }

        const slashMatch = String(value).match(
          /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/,
        );
        if (slashMatch) {
          return `${slashMatch[3]}-${pad2(slashMatch[1])}-${pad2(slashMatch[2])}`;
        }

        const parsedDate = new Date(value);
        if (!Number.isNaN(parsedDate.getTime())) {
          return formatLocalDate(parsedDate);
        }

        return String(value).trim();
      }

      function normalizeTime(value) {
        if (!value) {
          return "";
        }

        const match = String(value)
          .trim()
          .match(/^(\d{1,2}):(\d{2})/);
        if (match) {
          return `${pad2(match[1])}:${match[2]}`;
        }

        const parsedDate = new Date(value);
        if (!Number.isNaN(parsedDate.getTime())) {
          return `${pad2(parsedDate.getHours())}:${pad2(parsedDate.getMinutes())}`;
        }

        return String(value).trim();
      }

      function formatLocalDate(date) {
        return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
      }

      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      document.getElementById("bookingForm").onsubmit = async (e) => {
        e.preventDefault();

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerText = "預約中...";

        const payload = {
          name: document.getElementById("name").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          date: document.getElementById("dateInput").value,
          time: document.getElementById("timeSelect").value,
        };

        try {
          const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(payload),
          });
          const result = await res.json();

          if (result.status === "success") {
            alert("預約成功");
            liff.closeWindow();
            return;
          }

          alert("預約失敗：" + result.message);
          btn.disabled = false;
          btn.innerText = "確認預約";
        } catch (err) {
          alert("預約送出失敗，請稍後再試");
          btn.disabled = false;
          btn.innerText = "確認預約";
        }
      };

      init();
    </script>
  </body>
</html>
