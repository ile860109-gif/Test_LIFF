<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>預約服務</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 20px;
        background: #f8f9fa;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        max-width: 400px;
        margin: auto;
      }
      h2 {
        text-align: center;
        color: #111;
        margin-bottom: 25px;
      }
      label {
        font-weight: 600;
        display: block;
        margin-top: 15px;
        font-size: 14px;
        color: #555;
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 16px;
        -webkit-appearance: none;
      }
      select {
        background-color: #fff;
        background-image: url('data:image/svg+xml;charset=US-ASCII,<svg%20xmlns="http://www.w3.org/2000/svg"%20width="24"%20height="24"%20viewBox="0%200%2024%2024"><path%20fill="%23aaa"%20d="M7%2010l5%205%205-5z"/></svg>');
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 20px;
        padding-right: 40px;
      }
      button {
        width: 100%;
        padding: 15px;
        background: #00b900;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        margin-top: 30px;
        cursor: pointer;
        font-weight: bold;
      }
      button:disabled,
      input:disabled,
      select:disabled {
        background-color: #e0e0e0;
        cursor: not-allowed;
      }
      .date-field {
        position: relative;
      }
      #dateDisplay {
        cursor: pointer;
        background: #fff;
        padding-right: 42px;
      }
      .calendar-trigger {
        position: absolute;
        right: 8px;
        top: 8px;
        width: 34px;
        height: 34px;
        margin: 0;
        padding: 0;
        border-radius: 6px;
        background: transparent;
        color: #111;
        font-size: 18px;
        line-height: 1;
      }
      .calendar-popover {
        display: none;
        position: absolute;
        z-index: 10;
        top: calc(100% + 8px);
        left: 0;
        width: 100%;
        padding: 14px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
        box-sizing: border-box;
      }
      .calendar-popover.is-open {
        display: block;
      }
      .calendar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .calendar-title {
        font-weight: 700;
        color: #111;
      }
      .calendar-nav {
        display: flex;
        gap: 8px;
      }
      .calendar-nav button {
        width: 30px;
        height: 30px;
        margin: 0;
        padding: 0;
        border-radius: 50%;
        background: transparent;
        color: #111;
        font-size: 20px;
        font-weight: 400;
      }
      .calendar-weekdays,
      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        text-align: center;
      }
      .calendar-weekdays {
        margin-bottom: 8px;
        color: #334155;
        font-size: 12px;
        font-weight: 700;
      }
      .calendar-day {
        width: 32px;
        height: 32px;
        margin: 0 auto;
        padding: 0;
        border-radius: 50%;
        background: transparent;
        color: #111;
        font-size: 13px;
        font-weight: 500;
      }
      .calendar-day.is-available {
        background: #c7ebff;
        color: #0f172a;
      }
      .calendar-day.is-selected {
        background: #0b63ce;
        color: #fff;
      }
      .calendar-day:disabled {
        background: transparent;
        color: #cbd5e1;
        cursor: default;
      }
      .calendar-empty {
        width: 32px;
        height: 32px;
      }
      .end-time {
        display: none;
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #f0fdf4;
        color: #166534;
        font-size: 14px;
        font-weight: 600;
      }
      .end-time.is-visible {
        display: block;
      }
      .time-note {
        margin-top: 6px;
        color: #64748b;
        font-size: 13px;
        line-height: 1.5;
      }
      .time-input-group {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #262626;
      }
      .time-input-group.is-disabled {
        background: #e0e0e0;
      }
      .time-input-group select {
        margin-top: 0;
        border: 0;
        border-radius: 4px;
        background: linear-gradient(#151515, #050505 50%, #151515);
        color: #fff;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        -webkit-appearance: none;
        appearance: none;
      }
      .time-input-group select:disabled {
        color: #777;
        background: #d1d5db;
      }
      .time-separator {
        color: #fff;
        font-size: 22px;
        font-weight: 700;
      }
      .time-input-group.is-disabled .time-separator {
        color: #777;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>預約服務</h2>
      <form id="bookingForm">
        <label>姓名</label>
        <input type="text" id="name" placeholder="請輸入姓名" required />

        <label>電話</label>
        <input type="tel" id="phone" placeholder="請輸入電話" required />

        <label>信箱</label>
        <input type="email" id="email" placeholder="請輸入信箱" required />

        <label>服務項目</label>
        <select id="serviceSelect" required>
          <option value="">請選擇服務項目</option>
          <option value="結構整合訓練">結構整合訓練</option>
          <option value="結構徒手">結構徒手</option>
        </select>

        <label>預約日期</label>
        <div class="date-field">
          <input
            type="text"
            id="dateDisplay"
            placeholder="請選擇日期"
            readonly
            required
          />
          <input type="hidden" id="dateInput" />
          <button
            type="button"
            class="calendar-trigger"
            id="calendarTrigger"
            aria-label="選擇日期"
          >
            ◱
          </button>
          <div class="calendar-popover" id="calendarPopover">
            <div class="calendar-header">
              <div class="calendar-title" id="calendarTitle"></div>
              <div class="calendar-nav">
                <button type="button" id="prevMonth" aria-label="上一個月">
                  ‹
                </button>
                <button type="button" id="nextMonth" aria-label="下一個月">
                  ›
                </button>
              </div>
            </div>
            <div class="calendar-weekdays">
              <div>日</div>
              <div>一</div>
              <div>二</div>
              <div>三</div>
              <div>四</div>
              <div>五</div>
              <div>六</div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>
        </div>

        <label>開始時間</label>
        <div class="time-input-group is-disabled" id="timeInputGroup">
          <select id="timeHour" required disabled>
            <option value="">時</option>
          </select>
          <span class="time-separator">:</span>
          <select id="timeMinute" required disabled>
            <option value="">分</option>
          </select>
        </div>
        <div class="time-note" id="timeNote">
          可填入小時：請先選擇服務與日期
        </div>
        <div class="end-time" id="endTimeDisplay"></div>

        <button type="submit" id="submitBtn">確認預約</button>
      </form>
    </div>

    <script>
      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbxXSgtJQrPUQQwa09hsVpiQVtPZPkr51YOe8xJ8QZBnejIgBcvoXdm-A6vjkYCntxbN_w/exec";
      const LIFF_ID = "2009975280-TRg5Qmp3";
      let allSlots = [];
      let availableDateSet = new Set();
      let selectedDate = "";
      let calendarMonth = new Date();

      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          const res = await fetch(`${GAS_URL}?action=getAvailable`);
          allSlots = (await res.json()).map((slot) => ({
            date: normalizeDate(slot.date),
            time: normalizeTime(slot.time),
            services: Array.isArray(slot.services) ? slot.services : [],
          }));

          refreshAvailableDates();
          calendarMonth = getInitialCalendarMonth();
          renderCalendar();
        } catch (e) {
          console.error("初始化失敗", e);
          allSlots = [];
          availableDateSet = new Set();
          renderCalendar();
        }
      }

      function refreshAvailableDates() {
        const service = document.getElementById("serviceSelect").value;
        availableDateSet = new Set(
          allSlots
            .filter((slot) => !service || getSlotService(slot, service))
            .map((slot) => slot.date)
            .filter(Boolean),
        );
      }

      function getInitialCalendarMonth() {
        const today = formatLocalDate(new Date());
        const firstAvailableDate =
          [...availableDateSet].filter((date) => date >= today).sort()[0] ||
          [...availableDateSet].sort()[0];

        if (firstAvailableDate) {
          return parseDate(firstAvailableDate);
        }

        return new Date();
      }

      function renderCalendar() {
        const year = calendarMonth.getFullYear();
        const month = calendarMonth.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDate = new Date(year, month + 1, 0).getDate();
        const grid = document.getElementById("calendarGrid");

        document.getElementById("calendarTitle").innerText =
          `${year}年${month + 1}月`;
        grid.innerHTML = "";

        for (let i = 0; i < firstDay.getDay(); i++) {
          const empty = document.createElement("div");
          empty.className = "calendar-empty";
          grid.appendChild(empty);
        }

        for (let day = 1; day <= lastDate; day++) {
          const dateValue = `${year}-${pad2(month + 1)}-${pad2(day)}`;
          const dayButton = document.createElement("button");
          dayButton.type = "button";
          dayButton.className = "calendar-day";
          dayButton.innerText = day;

          if (availableDateSet.has(dateValue)) {
            dayButton.classList.add("is-available");
            dayButton.addEventListener("click", () => selectDate(dateValue));
          } else {
            dayButton.disabled = true;
          }

          if (dateValue === selectedDate) {
            dayButton.classList.add("is-selected");
          }

          grid.appendChild(dayButton);
        }
      }

      function selectDate(dateValue) {
        selectedDate = dateValue;
        document.getElementById("dateInput").value = dateValue;
        document.getElementById("dateDisplay").value =
          formatDisplayDate(dateValue);
        document.getElementById("calendarPopover").classList.remove("is-open");
        updateTimeSelect();
        renderCalendar();
      }

      function updateService() {
        refreshAvailableDates();
        hideEndTime();

        if (selectedDate && !availableDateSet.has(selectedDate)) {
          selectedDate = "";
          document.getElementById("dateInput").value = "";
          document.getElementById("dateDisplay").value = "";
        }

        calendarMonth = selectedDate
          ? parseDate(selectedDate)
          : getInitialCalendarMonth();
        updateTimeSelect();
        renderCalendar();
      }

      function updateTimeSelect() {
        const timeHour = document.getElementById("timeHour");
        const timeMinute = document.getElementById("timeMinute");
        const timeInputGroup = document.getElementById("timeInputGroup");
        const timeNote = document.getElementById("timeNote");
        const slots = getAvailableSlotsForDateAndService(selectedDate);
        const hours = getAvailableHours(slots);

        hideEndTime();
        setSelectOptions(timeHour, [], "時");
        setSelectOptions(timeMinute, [], "分");

        if (!document.getElementById("serviceSelect").value || !selectedDate) {
          setTimeInputsDisabled(true);
          timeInputGroup.classList.add("is-disabled");
          timeNote.innerText = "可填入小時：請先選擇服務與日期";
          return;
        }

        if (slots.length === 0) {
          setTimeInputsDisabled(true);
          timeInputGroup.classList.add("is-disabled");
          timeNote.innerText = "可填入小時：此日期無可預約時間";
          return;
        }

        setTimeInputsDisabled(false);
        timeInputGroup.classList.remove("is-disabled");
        setSelectOptions(timeHour, hours, "時");
        timeMinute.disabled = true;
        timeNote.innerText = "可選時間：請先選擇小時，再選擇分鐘";
      }

      function updateMinuteSelect() {
        const timeHour = document.getElementById("timeHour");
        const timeMinute = document.getElementById("timeMinute");
        const minutes = getAvailableMinutesForHour(
          getAvailableSlotsForDateAndService(selectedDate),
          timeHour.value,
        );

        hideEndTime();
        setSelectOptions(timeMinute, minutes, "分");
        timeMinute.disabled = !timeHour.value || minutes.length === 0;
      }

      function updateEndTimeDisplay() {
        const slot = getSelectedSlot();
        const endTimeDisplay = document.getElementById("endTimeDisplay");

        if (!slot) {
          hideEndTime();
          return;
        }

        endTimeDisplay.innerText = `調整結束時間：${addMinutesToTime(getRequestedStartTime(), slot.service.duration)}`;
        endTimeDisplay.classList.add("is-visible");
      }

      function hideEndTime() {
        const endTimeDisplay = document.getElementById("endTimeDisplay");
        endTimeDisplay.innerText = "";
        endTimeDisplay.classList.remove("is-visible");
      }

      function getAvailableSlotsForDateAndService(dateValue) {
        const service = document.getElementById("serviceSelect").value;
        if (!dateValue || !service) {
          return [];
        }

        return allSlots
          .map((slot) => ({
            date: slot.date,
            time: slot.time,
            service: getSlotService(slot, service),
          }))
          .filter(
            (slot) => slot.date === dateValue && slot.time && slot.service,
          )
          .sort((a, b) => a.time.localeCompare(b.time));
      }

      function getSlotService(slot, serviceName) {
        return (
          slot.services.find((service) => service.name === serviceName) || null
        );
      }

      function getSelectedSlot() {
        const time = getRequestedStartTime();
        if (!selectedDate || !time) {
          return null;
        }

        return getAvailableSlotsForDateAndService(selectedDate).find(
          (slot) => normalizeTime(slot.time) === time,
        );
      }

      function getRequestedStartTime() {
        const hourValue = document.getElementById("timeHour").value;
        const minuteValue = document.getElementById("timeMinute").value;

        return hourValue && minuteValue ? `${hourValue}:${minuteValue}` : "";
      }

      function setTimeInputsDisabled(disabled) {
        document.getElementById("timeHour").disabled = disabled;
        document.getElementById("timeMinute").disabled = disabled;
      }

      function addMinutesToTime(timeValue, minutesToAdd) {
        const match = String(timeValue || "").match(/^(\d{2}):(\d{2})$/);
        if (!match) {
          return "";
        }

        const total = Number(match[1]) * 60 + Number(match[2]) + minutesToAdd;
        return `${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`;
      }

      function getAvailableHours(slots) {
        return [
          ...new Set(
            slots
              .map((slot) => normalizeTime(slot.time).slice(0, 2))
              .filter(Boolean),
          ),
        ].sort();
      }

      function getAvailableMinutesForHour(slots, hour) {
        if (!hour) {
          return [];
        }

        return [
          ...new Set(
            slots
              .map((slot) => normalizeTime(slot.time))
              .filter((time) => time.slice(0, 2) === hour)
              .map((time) => time.slice(3, 5)),
          ),
        ].sort();
      }

      function setSelectOptions(select, values, placeholder) {
        select.innerHTML = "";

        const placeholderOption = document.createElement("option");
        placeholderOption.value = "";
        placeholderOption.textContent = placeholder;
        select.appendChild(placeholderOption);

        values.forEach((value) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          select.appendChild(option);
        });
      }

      function changeMonth(offset) {
        calendarMonth = new Date(
          calendarMonth.getFullYear(),
          calendarMonth.getMonth() + offset,
          1,
        );
        renderCalendar();
      }

      function toggleCalendar() {
        document.getElementById("calendarPopover").classList.toggle("is-open");
      }

      function closeCalendarOnOutsideClick(event) {
        const dateField = document.querySelector(".date-field");
        if (!dateField.contains(event.target)) {
          document
            .getElementById("calendarPopover")
            .classList.remove("is-open");
        }
      }

      function normalizeDate(value) {
        if (!value) {
          return "";
        }

        if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
          return value;
        }

        const slashMatch = String(value).match(
          /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/,
        );
        if (slashMatch) {
          return `${slashMatch[3]}-${pad2(slashMatch[1])}-${pad2(slashMatch[2])}`;
        }

        const parsedDate = new Date(value);
        if (!Number.isNaN(parsedDate.getTime())) {
          return formatLocalDate(parsedDate);
        }

        return String(value).trim();
      }

      function normalizeTime(value) {
        if (!value) {
          return "";
        }

        const match = String(value)
          .trim()
          .match(/^(\d{1,2}):(\d{2})/);
        if (match) {
          return `${pad2(match[1])}:${match[2]}`;
        }

        const parsedDate = new Date(value);
        if (!Number.isNaN(parsedDate.getTime())) {
          return `${pad2(parsedDate.getHours())}:${pad2(parsedDate.getMinutes())}`;
        }

        return String(value).trim();
      }

      function parseDate(dateValue) {
        const parts = dateValue.split("-").map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function formatLocalDate(date) {
        return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
      }

      function formatDisplayDate(dateValue) {
        const date = parseDate(dateValue);
        return `${pad2(date.getMonth() + 1)}/${pad2(date.getDate())}/${date.getFullYear()}`;
      }

      function formatConfirmDate(dateValue) {
        const date = parseDate(dateValue);
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
      }

      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      document
        .getElementById("serviceSelect")
        .addEventListener("change", updateService);
      document
        .getElementById("dateDisplay")
        .addEventListener("click", toggleCalendar);
      document
        .getElementById("calendarTrigger")
        .addEventListener("click", toggleCalendar);
      document
        .getElementById("prevMonth")
        .addEventListener("click", () => changeMonth(-1));
      document
        .getElementById("nextMonth")
        .addEventListener("click", () => changeMonth(1));
      document
        .getElementById("timeHour")
        .addEventListener("change", updateMinuteSelect);
      document
        .getElementById("timeMinute")
        .addEventListener("change", updateEndTimeDisplay);
      document.addEventListener("click", closeCalendarOnOutsideClick);

      document.getElementById("bookingForm").onsubmit = async (e) => {
        e.preventDefault();

        const service = document.getElementById("serviceSelect").value;
        const slot = getSelectedSlot();

        if (!service) {
          alert("請選擇服務項目");
          return;
        }

        if (!selectedDate) {
          alert("請選擇預約日期");
          return;
        }

        if (!slot) {
          alert("請輸入此日期可預約的開始時間");
          return;
        }

        const requestedTime = getRequestedStartTime();
        const requestedEndTime = addMinutesToTime(
          requestedTime,
          slot.service.duration,
        );
        const confirmText =
          `請確認是否預約：\n` +
          `${service}\n` +
          `${formatConfirmDate(selectedDate)} ${requestedTime} 到 ${requestedEndTime}`;

        if (!confirm(confirmText)) {
          return;
        }

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerText = "預約中...";

        const payload = {
          name: document.getElementById("name").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          email: document.getElementById("email").value.trim(),
          service: service,
          date: selectedDate,
          time: requestedTime,
        };

        try {
          const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(payload),
          });
          const result = await res.json();

          if (result.status === "success") {
            if (result.calendarWarning) {
              console.warn(result.calendarWarning);
            }
            alert("預約成功");
            liff.closeWindow();
            return;
          }

          alert("預約失敗：" + result.message);
          btn.disabled = false;
          btn.innerText = "確認預約";
        } catch (err) {
          alert("預約送出失敗，請稍後再試");
          btn.disabled = false;
          btn.innerText = "確認預約";
        }
      };

      init();
    </script>
  </body>
</html>
