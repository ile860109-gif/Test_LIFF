<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>預約系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #f4f7f6;
        color: #333;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        margin: auto;
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
        font-size: 14px;
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 16px;
      }
      button {
        width: 100%;
        padding: 15px;
        background: #00b900;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        margin-top: 25px;
        cursor: pointer;
        font-weight: bold;
      }
      button:disabled {
        background: #bbb;
      }
      .hint {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="text-align: center; margin-top: 0">預約時段</h2>
      <form id="bookingForm">
        <label>員工編號</label>
        <input type="text" id="empId" placeholder="請輸入員編" required />

        <label>姓名</label>
        <input type="text" id="name" placeholder="請輸入姓名" required />

        <label>電話</label>
        <input type="tel" id="phone" placeholder="請輸入電話" required />

        <label>預約日期</label>
        <input type="date" id="dateInput" onchange="filterTimes()" required />
        <p class="hint">請先選擇日期，再選擇時段</p>

        <label>預約時段</label>
        <select id="timeSelect" required disabled>
          <option value="">請先選擇日期</option>
        </select>

        <button type="submit" id="submitBtn">立即預約</button>
      </form>
    </div>

    <script>
      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbx1HtD2_Zhwu_8EwQVzf3O-z3WhOh-zRsiTMu4wqOmIGRU_II7k1nJ4Oui3QepefvbxwQ/exec";
      const LIFF_ID = "2009975280-TRg5Qmp3";
      let allSlots = [];

      async function init() {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        }
        // 初始化時先抓取所有時段
        const res = await fetch(`${GAS_URL}?action=getAvailable`);
        allSlots = await res.json();
      }

      function filterTimes() {
        const selectedDate = document.getElementById("dateInput").value;
        const timeSelect = document.getElementById("timeSelect");

        // 找尋對應日期的時間 (例如：10:00)
        const availableTimes = allSlots
          .filter((s) => s.date === selectedDate)
          .map((s) => s.time);

        if (availableTimes.length > 0) {
          timeSelect.disabled = false;
          timeSelect.innerHTML = availableTimes
            .map((t) => `<option value="${t}">${t}</option>`)
            .join("");
        } else {
          timeSelect.disabled = true;
          timeSelect.innerHTML = '<option value="">該日無可用時段</option>';
        }
      }

      document.getElementById("bookingForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerText = "預約傳送中...";

        const payload = {
          empId: document.getElementById("empId").value,
          name: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          date: document.getElementById("dateInput").value,
          time: document.getElementById("timeSelect").value,
        };

        try {
          const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(payload),
          });
          const result = await res.json();
          if (result.status === "success") {
            alert("預約成功！");
            liff.closeWindow();
          } else {
            alert("錯誤：" + result.message);
            btn.disabled = false;
          }
        } catch (err) {
          alert("系統連線失敗");
          btn.disabled = false;
        }
      };

      init();
    </script>
  </body>
</html>
