<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>歷史總步數排行榜</title>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: dark;
        --page: #0b0b0c;
        --surface: #1d1d20;
        --surface-border: #28282c;
        --muted: #96959c;
        --text: #f7f5f2;
        --accent: #ffa144;
        --first: #ff681f;
        --second: #f8a344;
        --third: #472a1d;
        --third-text: #ffc08e;
      }

      html {
        min-height: 100%;
        background: var(--page);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: Arial, "Noto Sans TC", sans-serif;
      }

      main {
        width: 100%;
        max-width: 420px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      h1 {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 21px;
        font-weight: 800;
        line-height: 1.4;
        text-align: center;
      }

      .search-wrap {
        position: relative;
      }

      .search-icon {
        position: absolute;
        top: 50%;
        left: 19px;
        width: 18px;
        height: 18px;
        color: #ff7a1a;
        pointer-events: none;
        transform: translateY(-50%);
      }

      .search-input {
        width: 100%;
        height: 50px;
        padding: 0 52px 0 47px;
        border: 1px solid transparent;
        border-radius: 25px;
        outline: none;
        background: var(--surface);
        color: var(--text);
        font-size: 15px;
        letter-spacing: 0;
      }

      .search-input::placeholder {
        color: var(--muted);
        opacity: 1;
      }

      .search-input::-webkit-search-cancel-button {
        display: none;
        appearance: none;
      }

      .search-input:focus {
        border-color: #713512;
        box-shadow: 0 0 0 1px #713512;
      }

      .clear-search {
        position: absolute;
        top: 50%;
        right: 10px;
        width: 31px;
        height: 31px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: #39393e;
        color: #d7d6da;
        cursor: pointer;
        transform: translateY(-50%);
      }

      .clear-search svg {
        width: 16px;
        height: 16px;
      }

      .list-meta {
        min-height: 38px;
        padding: 9px 9px 7px;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .search-count {
        color: #d8d5d1;
      }

      .ranking-list {
        display: grid;
        gap: 9px;
      }

      .ranking-row {
        min-height: 60px;
        padding: 13px 17px;
        display: grid;
        grid-template-columns: minmax(56px, max-content) minmax(0, 1fr) 90px;
        column-gap: 11px;
        align-items: center;
        border-radius: 24px;
        background: var(--surface);
        color: var(--text);
      }

      .ranking-row.rank-1 {
        background: var(--first);
        color: #111113;
      }

      .ranking-row.rank-2 {
        background: var(--second);
        color: #111113;
      }

      .ranking-row.rank-3 {
        background: var(--third);
        color: var(--third-text);
      }

      .rank-number {
        min-width: 0;
        font-size: 23px;
        font-weight: 900;
        line-height: 1;
        white-space: nowrap;
      }

      .ranking-row:not(.rank-1):not(.rank-2):not(.rank-3) .rank-number {
        color: #9a999f;
      }

      .rank-name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.35;
      }

      .rank-value {
        color: var(--accent);
        font-size: 14px;
        font-weight: 900;
        line-height: 1.2;
        text-align: right;
        white-space: nowrap;
      }

      .ranking-row.rank-1 .rank-value,
      .ranking-row.rank-2 .rank-value {
        color: #111113;
      }

      .ranking-row.rank-3 .rank-value {
        color: var(--third-text);
      }

      .state {
        min-height: 180px;
        padding: 62px 20px 20px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
        text-align: center;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 350px) {
        main {
          padding-right: 10px;
          padding-left: 10px;
        }

        .ranking-row {
          padding-right: 13px;
          padding-left: 13px;
          grid-template-columns: minmax(52px, max-content) minmax(0, 1fr) 78px;
          column-gap: 8px;
        }

        .rank-number {
          font-size: 21px;
        }

        .rank-value {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="pageTitle">歷史排行榜</h1>

      <div class="search-wrap">
        <i class="search-icon" data-lucide="search" aria-hidden="true"></i>
        <input
          id="searchInput"
          class="search-input"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="搜尋你的名字"
          aria-label="以中文或英文姓名搜尋排行榜"
        />
        <button
          id="clearSearch"
          class="clear-search"
          type="button"
          title="清除搜尋"
          aria-label="清除搜尋"
          hidden
        >
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>

      <div class="list-meta">
        <span id="metricLabel">總步數</span>
        <span id="searchCount" class="search-count" hidden></span>
      </div>

      <div id="rankingList" class="ranking-list"></div>
      <div id="state" class="state">正在載入排行榜...</div>
    </main>

    <script>
      const CONFIG = {
        GAS_URL:
          "https://script.google.com/macros/s/AKfycbzY34suBUlodrWr_GOTYBuW1sA4nXbyU12GkPSsdMzXN7Y3LQuXR49mM0zX3qB1NkTNXA/exec",
      };

      let allRankingItems = [];

      function initIcons() {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      async function init() {
        initIcons();
        bindSearchEvents();

        if (
          !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(
            CONFIG.GAS_URL,
          )
        ) {
          showState("尚未設定歷史排行榜 GAS 網址");
          return;
        }

        try {
          const data = await jsonpRequestWithRetry({
            action: "historicalRankings",
          });
          if (data.result !== "success") {
            throw new Error(data.message || "排行榜讀取失敗");
          }

          document.getElementById("pageTitle").textContent =
            data.title || formatMonthTitle(data.month);
          allRankingItems = Array.isArray(data.items) ? data.items : [];
          renderRanking(allRankingItems);
        } catch (err) {
          showState(err.message || "排行榜讀取失敗，請稍後再試。");
        }
      }

      function bindSearchEvents() {
        const input = document.getElementById("searchInput");
        const clearButton = document.getElementById("clearSearch");

        input.addEventListener("input", applySearch);
        clearButton.addEventListener("click", () => {
          input.value = "";
          input.focus();
          applySearch();
        });
      }

      function applySearch() {
        const input = document.getElementById("searchInput");
        const clearButton = document.getElementById("clearSearch");
        const keyword = normalizeSearchText(input.value);

        clearButton.hidden = !keyword;
        if (!keyword) {
          renderRanking(allRankingItems);
          return;
        }

        const matches = allRankingItems.filter((item) => {
          const searchable = [item.nameZh].map(normalizeSearchText).join("\n");
          return searchable.includes(keyword);
        });
        renderRanking(matches, true);
      }

      function renderRanking(items, isSearchResult = false) {
        const list = document.getElementById("rankingList");
        const state = document.getElementById("state");
        const metricLabel = document.getElementById("metricLabel");
        const searchCount = document.getElementById("searchCount");

        list.replaceChildren();
        metricLabel.hidden = isSearchResult;
        searchCount.hidden = !isSearchResult;
        if (isSearchResult) {
          searchCount.textContent = `找到 ${items.length} 位`;
        }

        if (!items.length) {
          showState(isSearchResult ? "找不到符合的名字" : "目前尚無排名資料");
          return;
        }

        state.hidden = true;
        items.forEach((item) => {
          const row = document.createElement("div");
          const rank = document.createElement("div");
          const name = document.createElement("div");
          const value = document.createElement("div");
          const numericRank = Number(item.rank);

          row.className = "ranking-row";
          if (numericRank >= 1 && numericRank <= 3) {
            row.classList.add(`rank-${numericRank}`);
          }
          rank.className = "rank-number";
          name.className = "rank-name";
          value.className = "rank-value";

          rank.textContent = `#${numericRank || "-"}`;
          name.textContent = item.nameZh || "-";
          value.textContent = formatNumber(item.value);

          row.append(rank, name, value);
          list.appendChild(row);
        });
      }

      function showState(message) {
        const state = document.getElementById("state");
        state.textContent = message;
        state.hidden = false;
        document.getElementById("rankingList").replaceChildren();
      }

      function normalizeSearchText(value) {
        return String(value || "")
          .normalize("NFKC")
          .trim()
          .toLocaleLowerCase("zh-TW");
      }

      function formatNumber(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number.toLocaleString("zh-TW") : "0";
      }

      function formatMonthTitle(month) {
        const match = /^(\d{4})-(\d{2})$/.exec(String(month || ""));
        return match
          ? `${Number(match[1])}年${Number(match[2])}月排行榜`
          : "歷史排行榜";
      }

      async function jsonpRequestWithRetry(params) {
        try {
          return await jsonpRequest(params);
        } catch (firstError) {
          await wait(800);
          return jsonpRequest(params);
        }
      }

      function jsonpRequest(params) {
        return new Promise((resolve, reject) => {
          const callbackName =
            "handleHistoryRankingResponse_" +
            Date.now() +
            "_" +
            Math.floor(Math.random() * 10000);
          const script = document.createElement("script");
          const timeoutId = window.setTimeout(() => {
            cleanup();
            reject(new Error("排行榜查詢逾時"));
          }, 20000);

          function cleanup() {
            window.clearTimeout(timeoutId);
            delete window[callbackName];
            script.remove();
          }

          window[callbackName] = (data) => {
            cleanup();
            resolve(data);
          };
          script.onerror = () => {
            cleanup();
            reject(new Error("排行榜查詢失敗"));
          };

          const query = new URLSearchParams({
            ...params,
            callback: callbackName,
            _: Date.now(),
          });
          script.src = `${CONFIG.GAS_URL}?${query.toString()}`;
          document.body.appendChild(script);
        });
      }

      function wait(milliseconds) {
        return new Promise((resolve) =>
          window.setTimeout(resolve, milliseconds),
        );
      }

      init();
    </script>
  </body>
</html>
